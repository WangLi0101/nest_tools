server {
    server_name tools.betterme.cyou;

    # 日志
    access_log /var/log/nginx/tools.access.log;
    error_log /var/log/nginx/tools.error.log;

    # 请求体大小限制（文件上传）
    client_max_body_size 50M;

    # Gzip 压缩配置
    gzip on;                          # 启用 gzip 压缩
    gzip_vary on;                     # 添加 Vary: Accept-Encoding 响应头
    gzip_proxied any;                 # 对所有代理请求启用压缩
    gzip_comp_level 6;                # 压缩级别 (1-9)，6 是性能和压缩率的平衡点
    gzip_min_length 1024;             # 最小压缩长度，小于 1KB 的响应不压缩
    gzip_buffers 16 8k;               # 压缩缓冲区
    gzip_http_version 1.1;            # 启用压缩的最低 HTTP 版本
    gzip_types                        # 需要压缩的 MIME 类型
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # 反向代理到 NestJS 后端
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 80;

}